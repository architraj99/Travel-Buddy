<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy</title>
    <link rel="stylesheet" href="style.css">

    <style>
        html{scroll-behavior:smooth;}
    </style>
</head>
<body>

    <nav>
        <div class="logo">Travel Buddy</div>

        <ul class="nav-links">

            <li><a href="#" onclick="goToSection('home')">Home</a> </li>
            <li><a href="#" onclick="goToSection('planner')">Planner</a> </li>
            <li><a href="#" onclick="goToSection('trips')">Trips</a> </li>
            <li><a href="#" onclick="goToSection('checklist')">Checklist</a> </li>
        </ul>
    </nav>
 
    <section class="hero" id="home">

        <div class="hero-content">

            <h1>Plan Your Next Adventure</h1>

            <p>Hey Buddy, Let's manage all your exciting travel plans here in one place </p>

            <button class="hero-btn" onclick="goToPlanner()">Start Planning</button>
        </div>

    </section>

    <section class="planner-section" id="planner">

        <h2>Trip Planner</h2>

        <div class="planner-card">

            <div class="input-group">

                <label>Destination</label>
                <input type="text" id="placeInput" placeholder="Where do you plan to go?">
            </div>

            <div class="input-group">

                <label>Travel Date</label>
                <input type="date" id="dateInput">
            </div>

            <div class="input-group">

                <label>Budget</label>
                <input type="number" id="budgetInput" placeholder="Enter budget">
            </div>

            <button class="add-btn" id="addBtn">Add Trip</button>

        </div>

    </section>

    <section class="trips-section" id="trips">

        <h2>Upcoming Trips</h2>

        <input type="text" id="searchInput" placeholder="Search Destination">

        <p id="tripCount">0 Trips Added</p>
        <p id="totalBudget">Total Budget: ₹0</p>

        <div class="trip-list" id="tripList"></div>

    </section>

    <section class="checklist-section" id="checklist">

        <h2>Packing Checklist</h2>
        <input type="text" id="itemInput" placeholder="Add item to checklist">

        <button id="addItemBtn">Add Item</button>

        <div class="checklist-card">

            <div class="check-item">

                <input type="checkbox">
                <label>Clothes</label>
            </div>

            <div class="check-item">

                <input type="checkbox">
                <label>Passport / ID</label>
            </div>

            <div class="check-item">

                <input type="checkbox">
                <label>Phone Charger</label>
            </div>

            <div class="check-item">

                <input type="checkbox">
                <label>Water Bottle</label>
            </div>

            <div class="check-item">

                <input type="checkbox">
                <label>First Aid Box</label>
            </div>

        </div>

    </section>

    <footer>
        <p>Travel Buddy</p>
    </footer>

    <script>
        function goToPlanner() {

            document.getElementById("planner").scrollIntoView({behavior: "smooth"});
        }

        function goToSection(sectionId) {

            document.getElementById(sectionId).scrollIntoView({behavior: "smooth"});
        }
    </script>

    <script src="script.js"></script>

</body>
</html>
